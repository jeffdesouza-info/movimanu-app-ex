spring:
  config:
    activate:
      on-profile: local
  cloud:
    config:
      enabled: false
  datasource:
    url: ${H2_URL:jdbc:h2:file:./data/movimanu;DB_CLOSE_ON_EXIT=FALSE}
    username: ${H2_USER:sa}
    password: ${H2_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      data-locations: classpath:db/local/demo-data.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
